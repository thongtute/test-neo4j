services:
  neo4j:
    image: neo4j:5.26-community
    container_name: video-neo4j-db
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"   # Neo4j Browser (giao diện web)
      - "7687:7687"   # Bolt (app kết nối vào cổng này)
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-password123}' 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  app:
    build: ./app
    container_name: video-neo4j-app
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password123}
      DATA_DIR: /data
      SIMILARITY_MAX_DISTANCE: ${SIMILARITY_MAX_DISTANCE:-8}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data   # video gốc + các đoạn đã cắt nằm ở ./data/videos/<id>/
    restart: unless-stopped

volumes:
  neo4j_data:
